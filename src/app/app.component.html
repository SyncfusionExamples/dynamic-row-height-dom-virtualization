<style>
  .control-section {
    margin-top: 100px;
  }
</style>
<div class="control-section">
  <ejs-grid #grid id='DOMVirtualGrid' [dataSource]='data' [query]='query' rowHeight='50' clipMode='EllipsisWithTooltip'
    [allowSelection]='true' height='400' [pageSettings]='pageSettings' [filterSettings]='filterSettings'
    [allowSorting]='true' [allowFiltering]='true' [enableVirtualization]='true' [enableDomVirtualization]='true'
    [domVirtualizationSettings]='domVirtualizationSettings'>
    <e-columns>
      <e-column field='EmployeeID' headerText='Employee ID' width='150' [isPrimaryKey]='true'
        textAlign='Right'></e-column>
      <e-column field='Employees' headerText='Employee Name' width='260'>

        <ng-template #template let-data>

          <div class="customer-details">
            <div class="customer-avatar" [ngClass]="getAvatarClass(data.Employees)">
              {{ getInitials(data.Employees) }}
            </div>
            <div class="customer-info">
              <p class="customer-name">{{ data.Employees }}</p>
              <p class="customer-email">{{ data.Mail }}</p>
            </div>

          </div>

        </ng-template>

      </e-column>
      <e-column field='Designation' headerText='Designation' width='170'></e-column>
      <e-column field='Status' headerText='Status' width='150'>
        <ng-template #template let-data>
          <div *ngIf="data.Status === 'Active';else login" class="statustemp e-activecolor">
            <span class="statustxt e-activecolor">{{data.Status}}</span>
          </div>
          <ng-template #login>
            <div class="statustemp e-inactivecolor">
              <span class="statustxt e-inactivecolor">{{data.Status}}</span>
            </div>
          </ng-template>
        </ng-template>
      </e-column>
      <e-column field='Trustworthiness' headerText='Trustworthiness' width='200' [visible]='false'>
        <ng-template #template let-data>
          <div class="trust">
            <img style="width: 31px; height: 24px"
              src="https://ej2.syncfusion.com/angular/demos/assets/grid/images/{{data.Trustworthiness}}.png" alt="" />
            <span id="Trusttext">{{data.Trustworthiness}}</span>
          </div>
        </ng-template>
      </e-column>
      <e-column field='Rating' [allowFiltering]='false' headerText='Rating' width='160' [visible]='false'>
        <ng-template #template let-data>
          <div class="rate">
            <div class="rating">
              <input ejs-rating [readOnly]="true" value={{data.Rating}} cssClass='custom-rating' />
            </div>
          </div>
        </ng-template>
      </e-column>
      <e-column field='Software' headerText='Software' [allowSorting]='false' [allowFiltering]='false' width='180'
        [visible]='false'>
        <ng-template #template let-data>
          <div id="myProgress" class="pbar">
            <div id="myBar" *ngIf="data.Status === 'Inactive';" [style.width.%]='softwareValue(data.Software)'
              class="bar progressdisable">
              <div id="pbarlabel" class="barlabel">{{softwareValue(data.Software)}}%</div>
            </div>
            <div id="myBar" *ngIf="data.Status === 'Active';" [style.width.%]='softwareValue(data.Software)'
              class="bar">
              <div id="pbarlabel" class="barlabel">{{softwareValue(data.Software)}}%</div>
            </div>
          </div>
        </ng-template>
      </e-column>
      <e-column field='CurrentSalary' headerText='Current Salary' format='C2' width='160' textAlign='Right'></e-column>
      <e-column field='Location' headerText='Location' width='140'>
      </e-column>
      <e-column field='Address' headerText='Address' width='240'></e-column>
    </e-columns>
  </ejs-grid>
</div>
